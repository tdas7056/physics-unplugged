<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffbe53" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff8800" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bulbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe68a"/>
      <stop offset="55%" stop-color="#ffaa40"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle for high contrast across browser tab themes -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#0a0d14" stroke="#ffaa40" stroke-width="2.5" stroke-opacity="0.4"/>
  <circle cx="32" cy="27" r="22" fill="url(#ambientGlow)"/>

  <!-- Light Bulb Silhouette & Glow -->
  <g filter="url(#glow)">
    <path d="M22 25c0-5.52 4.48-10 10-10s10 4.48 10 10c0 3.73-2.04 6.98-5.06 8.67-.94.53-1.54 1.5-1.54 2.58v2.25h-6.8v-2.25c0-1.08-.6-2.05-1.54-2.58C24.04 31.98 22 28.73 22 25z"
          fill="url(#bulbGradient)" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.8"/>

    <!-- Filament core -->
    <path d="M29 27v-5c0-.55.45-1 1-1h4c.55 0 1 .45 1 1v5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Base / Screw contacts -->
  <rect x="26.5" y="40.5" width="11" height="2.5" rx="1.2" fill="url(#baseGradient)"/>
  <rect x="28" y="44" width="8" height="2.5" rx="1.2" fill="url(#baseGradient)"/>
  <rect x="30" y="47.5" width="4" height="2" rx="1" fill="#ffaa40"/>

  <!-- Sparkle highlight -->
  <circle cx="32" cy="21" r="1.5" fill="#ffffff"/>
</svg>
